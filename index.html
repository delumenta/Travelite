<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f6f4ef"><meta name="description" content="Travelite — a thoughtful home for every trip."><title>Travelite — go further, feel closer</title><link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"></head><body><div id="app"><div id="boot-screen" style="min-height:100vh;display:grid;place-items:center;background:#0b0c0e;color:#f4eeee;font-family:system-ui,sans-serif;padding:24px;text-align:center"><div><strong style="display:block;font-size:22px;margin-bottom:8px">Travelite</strong><span style="font-size:12px;opacity:.65">Loading your journey…</span></div></div></div><script>
window.__traveliteBootTimer=setTimeout(function(){
  var root=document.getElementById('app');
  if(root && document.getElementById('boot-screen')){
    root.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;background:#0b0c0e;color:#f4eeee;font-family:system-ui,sans-serif;padding:28px;text-align:center"><div style="max-width:420px"><h2 style="margin:0 0 10px">Travelite could not start.</h2><p style="opacity:.72;line-height:1.6">The app JavaScript did not finish loading. Refresh once. If this message stays, send me this screen and I can trace the exact load failure.</p><small style="opacity:.45">BOOT-20260926-1727</small></div></div>';
  }
},8000);
window.addEventListener('error',function(event){
  var root=document.getElementById('app');
  if(root && document.getElementById('boot-screen')){
    var msg=(event && event.message)||'JavaScript failed to load.';
    root.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;background:#0b0c0e;color:#f4eeee;font-family:system-ui,sans-serif;padding:28px;text-align:center"><div style="max-width:520px"><h2 style="margin:0 0 10px">Travelite startup error</h2><p style="opacity:.75;line-height:1.5;word-break:break-word">'+String(msg).replace(/[&<>]/g,function(x){return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[x]})+'</p><small style="opacity:.45">BOOT-20260926-1727</small></div></div>';
  }
},true);
window.addEventListener('unhandledrejection',function(event){
  var root=document.getElementById('app');
  if(root && document.getElementById('boot-screen')){
    var reason=event && event.reason;
    var msg=(reason && (reason.message||String(reason)))||'Startup promise failed.';
    root.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;background:#0b0c0e;color:#f4eeee;font-family:system-ui,sans-serif;padding:28px;text-align:center"><div style="max-width:520px"><h2 style="margin:0 0 10px">Travelite startup error</h2><p style="opacity:.75;line-height:1.5;word-break:break-word">'+String(msg).replace(/[&<>]/g,function(x){return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[x]})+'</p><small style="opacity:.45">BOOT-20260926-1727</small></div></div>';
  }
});
</script><script type="module" src="/src/main.js"></script></body></html>
